syntax = "proto3";
package auth;

import "google/protobuf/timestamp.proto";


enum Status {
  AUTH_SUCCESS = 0;
  AUTH_FAILED = 1;
  INVALID_CREDENTIALS = 2;
  EXPIRED_TOKEN = 3;          
  ACCOUNT_LOCKED = 4;         
  USER_NOT_FOUND = 5;         
  INVALID_PASSWORD = 6;       
}

message Token {
  string uid = 1;
  string email = 2;                      
  string access_token = 3;               
  string refresh_token = 4;              
  Status status = 5;                     
  string error_message = 6;              
  google.protobuf.Timestamp access_token_expiration = 7;  
  google.protobuf.Timestamp refresh_token_expiration = 8; 
  bool mfa_required = 9;                
  google.protobuf.Timestamp last_login = 10;  
}

message Credentials{
  string email = 1;
  string password = 2;
  string client_id = 3;
}

message AuthToken{
  string token = 1;
  Status status = 2;
  string error_message = 3;
}
message RefreshToken{
  string token = 1;
}

message Revoke{
  string message = 1;
  Status status = 2;
}
message AccessToken{
  string token = 1;
}
message Login{
  bool canLogin = 1;
}


message User{
  string name = 1;
  string email = 2;
  string password = 3;
  string provider = 4;
  string provider_uid = 5;
}

message RegisterStatus{
  Status status = 1;
}

service auth{
  rpc auth(Credentials) returns (Token);
  rpc token(RefreshToken) returns(AuthToken);
  rpc revoke(RefreshToken) returns(Revoke);
  rpc register(User) returns(RegisterStatus);
}