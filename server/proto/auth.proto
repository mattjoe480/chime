syntax = "proto3";
package auth;

import "google/protobuf/timestamp.proto";


enum Status {
  AUTH_SUCCESS = 0;
  AUTH_FAILED = 1;
  INVALID_CREDENTIALS = 2;
  EXPIRED_TOKEN = 3;          
  ACCOUNT_LOCKED = 4;         
  USER_NOT_FOUND = 5;
  MFA_REQUIRED = 6;
  MFA_FAILED = 7;
  INVALID_TOKEN = 8;
  DUPLICATE_EMAIL = 9;
  WEAK_PASSWORD = 10;
  INVALID_PROVIDER = 11;
  INTERNAL_ERROR = 12;
  INVALID_EMAIL = 13;
}

enum AuthProvider {
  GOOGLE = 0;
  FACEBOOK = 1;
  GITHUB = 2;
}
message OAuth {
  string oauth_token = 1;
  string expires_in = 2;
  string expires_at = 3;
  string providerAccountID = 4;
  string provider = 5;
}

message Token {
  string uid = 1;
  string email = 2;                      
  string access_token = 3;               
  string refresh_token = 4;              
  Status status = 5;                     
  string error_message = 6;              
  google.protobuf.Timestamp access_token_expiration = 7;  
  google.protobuf.Timestamp refresh_token_expiration = 8; 
  bool mfa_required = 9;                
  google.protobuf.Timestamp last_login = 10;  
}

message Credentials{
  string email = 1;
  string password = 2;
}

message AuthRequest {
  oneof data {
    Credentials credentials = 1;
    OAuth oauth = 2;
  }
}

message AuthToken{
  string token = 1;
  Status status = 2;
  string error_message = 3;
}
message RefreshToken{
  string token = 1;
}

message Revoke{
  string message = 1;
  Status status = 2;
}
message AccessToken{
  string token = 1;
}
message Login{
  bool canLogin = 1;
}


message User{
  string name = 1;
  string email = 2;
  string password = 3;
  string provider = 4;
  string provider_uid = 5;
}

message RegisterStatus{
  Status status = 1;
}

service auth{
  rpc auth(AuthRequest) returns (Token);
  rpc token(RefreshToken) returns(AuthToken);
  rpc revoke(RefreshToken) returns(Revoke);
  rpc register(User) returns(RegisterStatus);
}