syntax = "proto3";
package onboarding;

message PatientOnboardingRequest {
  string user_id = 1;
  string date_of_birth = 2;
  string emergency_contact_name = 3;
  string emergency_contact_phone = 4;
  string medical_conditions = 5;
  string current_medications = 6;
}

message DoctorOnboardingRequest {
  string user_id = 1;
  string medical_license = 2;
  string specialization = 3;
  int32 years_of_experience = 4;
  string hospital_affiliation = 5;
}

message OnboardingRequest {
  oneof profile {
    PatientOnboardingRequest patient = 1;
    DoctorOnboardingRequest doctor = 2;
  }
}

enum Status {
  OK = 0;
  ERROR = 1;
  INVALID_INPUT = 2;
  INTERNAL_ERROR = 3;
}

message OnboardingResponse {
  Status status = 1;
  string message = 2;
}

service Onboarding {
  rpc CompleteOnboarding(OnboardingRequest) returns (OnboardingResponse);
}