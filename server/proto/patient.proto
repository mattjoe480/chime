syntax = "proto3";
package patient;

import "google/protobuf/timestamp.proto";
import "auth.proto";

// Patient profile information
message PatientProfile {
  string id = 1;
  string user_id = 2;
  string name = 3;
  string email = 4;
  google.protobuf.Timestamp date_of_birth = 5;
  string emergency_contact_name = 6;
  string emergency_contact_phone = 7;
  string medical_conditions = 8;
  string current_medications = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

// Medical record entry
message MedicalRecord {
  string id = 1;
  string patient_id = 2;
  string doctor_id = 3;
  google.protobuf.Timestamp date = 4;
  string diagnosis = 5;
  string treatment = 6;
  string notes = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

// Prescription information
message Prescription {
  string id = 1;
  string patient_id = 2;
  string doctor_id = 3;
  string medication_name = 4;
  string dosage = 5;
  string frequency = 6;
  google.protobuf.Timestamp start_date = 7;
  optional google.protobuf.Timestamp end_date = 8;
  string instructions = 9;
  string status = 10;  // Active, Completed, Cancelled
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

// Test result information
message TestResult {
  string id = 1;
  string patient_id = 2;
  string doctor_id = 3;
  string test_name = 4;
  google.protobuf.Timestamp test_date = 5;
  string results = 6;
  string reference_range = 7;
  string interpretation = 8;
  string status = 9;  // Pending, Completed, Cancelled
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

// Appointment information
message Appointment {
  string id = 1;
  string patient_id = 2;
  string doctor_id = 3;
  google.protobuf.Timestamp datetime = 4;
  int32 duration = 5;  // in minutes
  string type = 6;     // Consultation, Follow-up, Check-up
  string status = 7;   // Scheduled, Completed, Cancelled
  string notes = 8;
  string reason = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

// Request/Response messages for services
message GetPatientProfileRequest {
  string patient_id = 1;
}

message GetPatientProfileResponse {
  PatientProfile profile = 1;
  auth.Status status = 2;
}

message UpdatePatientProfileRequest {
  string patient_id = 1;
  optional string emergency_contact_name = 2;
  optional string emergency_contact_phone = 3;
  optional string medical_conditions = 4;
  optional string current_medications = 5;
}

message UpdatePatientProfileResponse {
  PatientProfile profile = 1;
  auth.Status status = 2;
}

message ListMedicalRecordsRequest {
  string patient_id = 1;
  int32 page = 2;
  int32 limit = 3;
}

message ListMedicalRecordsResponse {
  repeated MedicalRecord records = 1;
  int32 total = 2;
  int32 page = 3;
  int32 total_pages = 4;
}

message ListPrescriptionsRequest {
  string patient_id = 1;
  int32 page = 2;
  int32 limit = 3;
  string status = 4;  // Optional filter by status
}

message ListPrescriptionsResponse {
  repeated Prescription prescriptions = 1;
  int32 total = 2;
  int32 page = 3;
  int32 total_pages = 4;
}

message ListTestResultsRequest {
  string patient_id = 1;
  int32 page = 2;
  int32 limit = 3;
  string status = 4;  // Optional filter by status
}

message ListTestResultsResponse {
  repeated TestResult results = 1;
  int32 total = 2;
  int32 page = 3;
  int32 total_pages = 4;
}

message ListAppointmentsRequest {
  string patient_id = 1;
  int32 page = 2;
  int32 limit = 3;
  string status = 4;  // Optional filter by status
  google.protobuf.Timestamp start_date = 5;
  google.protobuf.Timestamp end_date = 6;
}

message ListAppointmentsResponse {
  repeated Appointment appointments = 1;
  int32 total = 2;
  int32 page = 3;
  int32 total_pages = 4;
}

message BookAppointmentRequest {
  string patient_id = 1;
  string doctor_id = 2;
  google.protobuf.Timestamp datetime = 3;
  string type = 4;
  string reason = 5;
}

message BookAppointmentResponse {
  Appointment appointment = 1;
  auth.Status status = 2;
}

message CancelAppointmentRequest {
  string appointment_id = 1;
  string reason = 2;
}

message CancelAppointmentResponse {
  auth.Status status = 1;
}

// Patient service definition
service PatientService {
  // Profile management
  rpc GetPatientProfile(GetPatientProfileRequest) returns (GetPatientProfileResponse);
  rpc UpdatePatientProfile(UpdatePatientProfileRequest) returns (UpdatePatientProfileResponse);
  
  // Medical records
  rpc ListMedicalRecords(ListMedicalRecordsRequest) returns (ListMedicalRecordsResponse);
  
  // Prescriptions
  rpc ListPrescriptions(ListPrescriptionsRequest) returns (ListPrescriptionsResponse);
  
  // Test results
  rpc ListTestResults(ListTestResultsRequest) returns (ListTestResultsResponse);
  
  // Appointments
  rpc ListAppointments(ListAppointmentsRequest) returns (ListAppointmentsResponse);
  rpc BookAppointment(BookAppointmentRequest) returns (BookAppointmentResponse);
  rpc CancelAppointment(CancelAppointmentRequest) returns (CancelAppointmentResponse);
} 