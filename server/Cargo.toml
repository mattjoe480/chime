bench = []
test = []
example = []

[[bin]]
path = "src/main.rs"
name = "server"
plugin = false
proc-macro = false
required-features = []

[package]
name = "server"
edition = "2021"
version = "0.0.1"
build = "build.rs"

[dependencies]
actix-web = "4.0"
argon2 = "0.5.3"
chrono = "0.4.38"
dotenv = "0.15.0"
futures = "0.3"
jsonwebtoken = "9.3.0"
lazy_static = "1.5.0"
log = "0.4.22"
mongodb = "3.1.0"
prometheus = "0.13.3"
prost = "0.13.4"
prost-types = "0.13.4"
redis = "0.27.5"
serde_json = "1.0"
tokio-stream = "0.1.16"
tonic-reflection = "0.12.3"
tracing = "0.1"
tracing-actix-web = "0.7"
tracing-subscriber = "0.3"

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.tokio]
version = "1"
features = ["full"]

[dependencies.tonic]
version = "0.12.3"
features = ["gzip"]

[dependencies.uuid]
version = "1.11.0"
features = ["fast-rng", "v7", "macro-diagnostics"]

[build-dependencies]
tonic-build = "0.12.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.release.package]
