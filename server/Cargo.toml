[[bin]]
path = "src/main.rs"
name = "server"
required-features = []

[package]
name = "server"
edition = "2021"
version = "0.0.1"
build = "build.rs"

[dependencies]
actix-web = "4.0"
argon2 = "0.5.3"
chrono = "0.4.38"
dotenv = "0.15.0"
futures = "0.3"
jsonwebtoken = "9.3.0"
lazy_static = "1.5.0"
prometheus = "0.13.3"
prost = "0.13.4"
prost-types = "0.13.4"
redis = "0.28.1"
serde_json = "1.0"
tokio-stream = "0.1.16"
tonic-reflection = "0.12.3"
tracing = "0.1.41"
tracing-actix-web = "0.7.15"
tracing-subscriber = "0.3.19"
charybdis = "0.7.10"
scylla = "0.15.1"
once_cell = "1.20.2"
regex-filtered = "0.2.0"
regex = "1.11.1"


[dependencies.serde]
version = "1.0.217"
features = ["derive"]

[dependencies.tokio]
version = "1.42.0"
features = ["full"]

[dependencies.tonic]
version = "0.12.2"
features = ["gzip"]

[dependencies.uuid]
version = "1.11.0"
features = ["fast-rng", "v7", "macro-diagnostics"]

[dependencies.sea-orm]
version = "1.1.3"
features = ["sqlx-postgres", "runtime-tokio", "macros", "debug-print", "with-chrono", "with-uuid"]

[dependencies.validator]
version = "0.19.0"
features = ["derive_nightly_features"]

[dependencies.reqwest]
version = "0.12.12"
features = ["default", "json"]

[build-dependencies]
tonic-build = "0.12.3"
charybdis = "0.7.10"


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
