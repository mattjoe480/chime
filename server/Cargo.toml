[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.0"
actix-rt = "2.5"
actix-service = "2.0.2"
argon2 = "0.5.3"
tokio = { version = "1", features = ["full"] }
tracing-actix-web = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"
mongodb = "3.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
dotenv = "0.15.0"
chrono = "0.4.38"
jsonwebtoken = "9.3.0"
lazy_static = "1.5.0"
redis = "0.27.5"
tokio-stream = "0.1.16"
tonic = { version = "0.12.3", features = ["gzip"]}
prost = "0.13.4"
prost-types = "0.13.4"
tonic-reflection = "0.12.3"
uuid = {version = "1.11.0", features = ["fast-rng", "v7", "macro-diagnostics"]}
prometheus = "0.13.3"
log = "0.4.22"

[[bin]]
name = "server"
path = "src/main.rs"

[build-dependencies]
tonic-build = "0.12.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units=1
panic = "abort"