name: pipeline
on:
  push:
    branches:
      - "main"
permissions:
  packages: write

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app/apps/web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chime/chime-next:latest
            ghcr.io/${{ github.repository_owner }}/chime/chime-next:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build-and-push-image
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      - name: create env file
        run: |
          echo "GIT_COMMIT_HASH=${{ github.sha }}" >> ./envfile

      

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
            credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Authenticate to GitHub Container Registry
        run: echo ${{ secrets.PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        
      - name: Build and deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v0
        with:
            service: ${{ secrets.GCP_SERVICE_NAME }}
            image: ghcr.io/${{ github.repository_owner }}/chime/chime-next:${{ github.sha }} s
            region: ${{ secrets.GCP_REGION }}
            allow_unauthenticated: true